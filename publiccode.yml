description:
  it-IT:
    localisedName: SCRIVA
    shortDescription: Sistema delle Scrivanie del Richiedente e del Funzionario per
      i procedimenti ambientali
    longDescription: >-
      SCRIVA nasce dall'esigenza di disporre di una soluzione trasversale per la
      gestione dei procedimenti ambientali, coerente con il modello generale per
      l’ICT della PA italiana promosso da AgID.

      Il servizio corrispondente è disponibile ai seguenti indirizzi:
            https://scriva-servizi.regione.piemonte.it/scrivafoweb
            https://scrivabo-servizi.regione.piemonte.it/scrivafoweb
            https://scriva-servizi.regione.piemonte.it/scrivaconsweb/

      SCRIVA intende offrire un punto di vista inter-tematico, di raccordo dei
      procedimenti in ottica user centered design, connettendo diversi business
      afferenti allo stesso richiedente o intervento/opera/attività sul
      territorio.

      Permette di gestire trasversalmente logiche comuni sfruttando la metafora
      della **Scrivania**, del richiedente e del funzionario incaricato.

      Offre strumenti di gestione stati/eventi, bacheca notifiche, scadenziario.

      Permette di trattare un **Adempimento** come un **processo**con le
      relative deleghe/procure ed anagrafiche soggetti/oggetti.

      Esempi di adempimenti trattati sono quelli relativi a
            • **VIA**
            • **VINCA**
            • **Derivazioni**

      Pone l'accento sui concetti di **Integrazione** ed **Interazione** con
      diversi sistemi e piattaforme, come per esempio
            • sistemi di **georeferenziazione**,
            • sistemi di **protocollazione & gestione documentale**,
            • sistemi come il **SUAP**,
            • **piattaforme di pagamento**

       SCRIVA semplifica, dematerializza e armonizza i servizi pubblici regionali relativi alle procedure ambientali rivolti a imprese, professionisti e cittadini, attraverso una nuova modalità di interazione e un maggiore livello di integrazione dei servizi regionali con la PA.
      Il sistema può essere visto come somma di due macro componenti funzionali 
            • **Front Office**: scrivania del Richiedente (privato, persona fisica o giuridica) che interagisce con la PA per la presentazione di un’istanza.
            • **Back Office**: scrivania del Funzionario (soggetto pubblico destinatario dell’istanza) che prende in carico la pratica e la gestisce coinvolgendo gli Enti Terzi.

      L’applicativo prevede moduli di front-end web che interagiscono tramite
      API con moduli di back-end dove risiede la logica di business e che
      accedono al DB.

      SCRIVA segue il paradigma **SPA Single Page Application**: la componente
      di interfaccia (Angular o Form.io) ha una corrispondente componente di
      back-end (Java) che espone API REST e accede al DB (indirettamente).
    documentation: https://www.servizi.piemonte.it/srv/scrivania-richiedente/rsr/dwd/manuale_scrivania_del_richiedente.pdf
    features:
      - gestione dei procedimenti ambientali, coerente con il modello AgID
      - gestione documentazione intervento/opera/attività sul territorio
      - gestione Scrivania del richiedente
      - gestione Scrivania del funzionario
      - strumenti di query & reporting
      - gestione stati/eventi, bacheca notifiche, scadenziario
      - gestione Processo con deleghe/procure, anagrafiche soggetti/oggetti
      - integrazione con georeferenziazione
      - integrazione con protocollazione e gestione documentale
      - integrazione con piattaforma pagamenti
      - integrazione con sistemi esterni come il SUAP
      - gestione interazione tra sistemi coinvolti, focus sul procedimento
