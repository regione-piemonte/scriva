description:
  it-IT:
    localisedName: SCRIVA
    shortDescription: Sistema delle Scrivanie del Richiedente e del Funzionario per
      i procedimenti ambientali
    longDescription: >-
      SCRIVA nasce dall'esigenza di disporre di una soluzione trasversale per la
      gestione dei procedimenti ambientali, coerente con il modello generale per
      l’ICT della PA italiana promosso da AgID.

      Permette di gestire trasversalmente logiche comuni tramite un Front Office
      (Scrivania del richiedente) ed un Back Office (Scrivania del Funzionario)
      per i procedimenti di tipo concessorio (VIA, VINCA, DERIVAZIONI...).

      Si integra con sistemi di protocollazione, gestione documentale, SUAP,
      georeferenzazione delle opere, piattaforme di pagamento.

      SCRIVA è realizzato seguendo il paradigma SPA Single Page Application, ed
      espone delle REST API di integrazione con altri sistemi. tramite apposito
      backend.
    documentation: https://www.servizi.piemonte.it/srv/scrivania-richiedente/rsr/dwd/manuale_scrivania_del_richiedente.pdf
    features:
      - gestione dei procedimenti ambientali, coerente con il modello AgID
      - gestione documentazione intervento/opera/attività sul territorio
      - gestione Scrivania del richiedente
      - gestione Scrivania del funzionario
      - strumenti di query e reporting
      - gestione stati/eventi, bacheca notifiche, scadenziario
      - gestione Processo con deleghe/procure, anagrafiche soggetti/oggetti
      - integrazione con georeferenziazione
      - integrazione con protocollazione e gestione documentale
      - integrazione con piattaforma pagamenti
      - integrazione con sistemi esterni come il SUAP
      - gestione interazione tra sistemi coinvolti, focus sul procedimento
